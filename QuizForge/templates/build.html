{% extends 'base.html' %}{% block content %}<small class="over">AUTHORING STUDIO</small><h1>Quiz builder</h1><form method="post" novalidate>{% csrf_token %}<section class="card fields"><h2>Quiz settings</h2>{{ form.as_p }}</section>{{ items.management_form }}{{ items.non_form_errors }}<div id="itemlist">{% for item in items %}<section class="card fields"><h2>Question {{ forloop.counter }}</h2>{{ item.as_p }}</section>{% endfor %}</div><template id="blank"><section class="card fields"><h2>New question</h2>{{ items.empty_form.as_p }}</section></template><div class="buttons"><button type="button" id="add">+ Add question</button><button name="action" value="draft">Save draft</button><button class="primary" name="action" value="publish">Publish quiz →</button></div></form>{% endblock %}
