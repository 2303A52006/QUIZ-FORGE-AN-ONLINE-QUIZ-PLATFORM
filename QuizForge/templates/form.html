{% extends 'base.html' %}{% block content %}<small class="over">ACCOUNT ACCESS</small><h1>{{ title }}</h1><section class="card narrow"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">{% if title == 'Welcome back' %}Sign in →{% elif password %}Save profile{% else %}Create account →{% endif %}</button></form>{% if title == 'Welcome back' %}<p>New student? <a href="{% url 'register' %}">Register here</a></p>{% endif %}</section>{% if password %}<section class="card narrow"><h2>Change password</h2><form method="post">{% csrf_token %}{{ password.as_p }}<button name="action" value="password">Update password</button></form></section>{% endif %}{% endblock %}
